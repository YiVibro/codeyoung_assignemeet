services:
  postgres:
    image: postgres:16-alpine
    container_name: codeyoung-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: codeyoung
      POSTGRES_PASSWORD: codeyoung_password
      POSTGRES_DB: codeyoung
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeyoung -d codeyoung"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: